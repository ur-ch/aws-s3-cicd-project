<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <style>
        body {
            background-color: #fff0f5; /* နောက်ခံ ပန်းရောင်နု */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff; /* အဖြူရောင် ကတ်ပြား */
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.15);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #d81b60;
            font-size: 32px;
            margin-bottom: 5px;
        }
        .emoji-icon {
            font-size: 35px;
            margin: 15px 0;
        }
        .divider {
            border: none;
            height: 2px;
            background-color: #f8bbd0;
            margin: 25px 0;
        }
        .box-text {
            background-color: #fff8fb;
            border: 1px solid #fce4ec;
            padding: 20px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.6;
            color: #4a4a4a;
            margin-bottom: 20px;
            text-align: left;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #4a4a4a;
            text-align: left;
        }
        .highlight {
            color: #d81b60;
            font-weight: bold;
            text-decoration: underline;
        }
        .footer {
            margin-top: 30px;
            font-size: 15px;
            color: #d81b60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to My AWS  S3 Space!</h1>
        <div class="emoji-icon">🌸</div>
        
        <hr class="divider">
        
        <div class="box-text">
            မင်္ဂလာပါ ဒါဟာ AWS S3 ပေါ်မှာ ကိုယ်တိုင်ဖန်တီးတင်ထားတဲ့ ကျွန်မရဲ့ ပထမဆုံး <span class="highlight">Static Website</span> လေး ဖြစ်ပါတယ်ရှင်။
        </div>
        
        <p>Cloud နည်းပညာတွေနဲ့ Network ပိုင်းကို လေ့လာရင်း လက်တွေ့စမ်းသပ်ချက်တစ်ခုအနေနဲ့ တည်ဆောက်ထားတာပါရှင့်။ 🌺</p>
        
        <div class="footer">
            ✨ Built with passion & AWS S3 ✨
               My First CI/CD Project
        </div>
    </div>

</body>
</html>
